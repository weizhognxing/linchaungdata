<section id="recordPanel" class="panel hidden">
  <h2 id="recordPanelTitle">校对检验指标</h2>
  <div id="recordPanelHint" class="hint"></div>
  <div class="subhead">病患信息</div>
  <div class="grid two">
    <input name="patient_name" placeholder="病患姓名">
    <div class="gender-row">
      <label class="gender-option"><input type="radio" name="patient_gender" value="男"> 男</label>
      <label class="gender-option"><input type="radio" name="patient_gender" value="女"> 女</label>
    </div>
    <input name="patient_age" type="number" placeholder="年龄">
    <input name="patient_phone" placeholder="联系电话">
    <input name="patient_id_number" placeholder="唯一识别号">
  </div>
  <div id="labFieldsSection">
    <div class="subhead">检验类别</div>
    <select id="labTestName" multiple class="hidden"></select>
    <div id="labCategoryCheckboxes" class="lab-category-picker"></div>
    <div id="labCategorySelectedSummary" class="selected-lab-categories">未选择检验类别</div>
    <div class="subhead">检验指标</div>
    <p id="labUnassignedHint" class="hint"></p>
    <div id="dynamicFields" class="grid two"></div>
  </div>
  <button id="saveRecordBtn">保存信息</button>
  <p class="message" id="recordMsg"></p>
</section>
