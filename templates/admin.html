<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PICCO 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-shell">
  <main class="admin-layout login-mode" id="adminLayout">
    <aside class="sidebar hidden" id="adminSidebar">
      <img src="/static/images/logo.png" alt="PICCO Logo" class="sidebar-logo">
      <p class="eyebrow">PICCO ADMIN</p>
      <h1>PICCO管理后台</h1>
      <button class="tab active" data-tab="members">会员管理</button>
      <button class="tab" data-tab="fields">检验表字段管理</button>
      <button class="tab" data-tab="patientFields">病患表字段管理</button>
      <button class="tab" data-tab="forms">表单显示配置</button>
      <button class="tab" data-tab="settings">系统设置</button>
    </aside>

    <section id="adminLogin" class="panel admin-login hidden">
      <h2>管理员登录</h2>
      <input id="adminUser" value="admin" placeholder="账号">
      <input id="adminPass" type="password" value="admin123" placeholder="密码">
      <button id="adminLoginBtn">登录后台</button>
      <p class="message" id="adminLoginMsg"></p>
    </section>

    <section id="adminContent" class="content hidden">
      <div id="members" class="admin-tab-page">
        <h2>会员管理</h2>
        <table><thead><tr><th>姓名</th><th>电话</th><th>单位/科室</th><th>状态</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table>
      </div>

      <div id="fields" class="admin-tab-page hidden">
        <h2>检验表字段管理</h2>
        <div class="panel inline-form">
          <input id="fieldLabel" placeholder="网页表单显示名称">
          <input id="fieldName" placeholder="字段名，如 serum_na">
          <select id="fieldType"><option value="decimal">小数</option><option value="int">整数</option><option value="varchar">短文本</option><option value="text">长文本</option><option value="date">日期</option><option value="datetime">日期时间</option></select>
          <input id="fieldUnit" placeholder="单位">
          <input id="fieldRefRange" placeholder="参考区间">
          <input id="fieldTestMethod" placeholder="实验方法">
          <button id="addFieldBtn">新增字段</button>
        </div>
        <p class="hint">字段名只能使用小写字母、数字和下划线，并且所有新增字段允许为空。</p>
        <div class="search-bar">
          <input id="fieldSearch" placeholder="搜索表单名称...">
          <button id="fieldSearchBtn">搜索</button>
        </div>
        <table><thead><tr><th>表单名称</th><th>字段名</th><th>类型</th><th>单位</th><th>参考区间</th><th>实验方法</th></tr></thead><tbody id="fieldRows"></tbody></table>
        <div class="pagination" id="fieldPagination"></div>
      </div>

      <div id="patientFields" class="admin-tab-page hidden">
        <h2>病患表字段管理</h2>
        <div class="panel inline-form patient-inline-form">
          <input id="patientFieldLabel" placeholder="网页表单显示名称">
          <input id="patientFieldName" placeholder="字段名，如 case_no">
          <select id="patientFieldType"><option value="varchar">短文本</option><option value="text">长文本</option><option value="int">整数</option><option value="decimal">小数</option><option value="date">日期</option><option value="datetime">日期时间</option></select>
          <button id="addPatientFieldBtn">新增病患字段</button>
        </div>
        <p class="hint">病患字段会写入 patients 表，并在病人详情页头部展示。</p>
        <div class="search-bar">
          <input id="patientFieldSearch" placeholder="搜索病患字段名称...">
          <button id="patientFieldSearchBtn">搜索</button>
        </div>
        <table><thead><tr><th>表单名称</th><th>字段名</th><th>类型</th></tr></thead><tbody id="patientFieldRows"></tbody></table>
        <div class="pagination" id="patientFieldPagination"></div>
      </div>

      <div id="forms" class="admin-tab-page hidden">
        <h2>表单显示配置</h2>
        <select id="diseaseSelect"></select>
        <div class="dual-listbox">
          <div class="listbox-panel">
            <h4>未选择字段</h4>
            <select id="availableFields" multiple></select>
          </div>
          <div class="listbox-actions">
            <button id="moveToRight" title="添加到表单">&raquo;</button>
            <button id="moveToLeft" title="从表单移除">&laquo;</button>
          </div>
          <div class="listbox-panel">
            <h4>已选择字段</h4>
            <select id="selectedFields" multiple></select>
          </div>
        </div>
        <button id="saveFormSettingBtn">保存配置</button>
        <p class="message" id="formSettingMsg"></p>
      </div>

      <div id="settings" class="admin-tab-page hidden">
        <h2>系统设置</h2>
        <div class="panel settings-form">
          <label for="doctorDownloadMultiplier">医生下载数据倍数</label>
          <input id="doctorDownloadMultiplier" type="number" min="0" step="1" placeholder="如 3">
          <p class="hint">表示上传过数据的医生，可下载多少倍于自己已上传数据量的数据。</p>
          <button id="saveSettingsBtn">保存设置</button>
          <p class="message" id="settingsMsg"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/js/jquery.min.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
