<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PICCO 客户端</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="client-shell">
  <main class="phone-card">
    <section id="clientHero" class="hero compact">
      <p class="eyebrow">PICCO</p>
      <h1>临床检验数据录入</h1>
      <p>选择疾病、拍照识别、校对表单并保存检验记录。</p>
    </section>

    <section id="loginPanel" class="panel hidden">
      <h2>用户登录</h2>
      <input id="loginAccount" placeholder="邮箱或手机号码">
      <input id="loginPassword" type="password" placeholder="密码">
      <button id="loginBtn">登录</button>
      <div class="links"><a data-show="registerPanel">注册账号</a><a data-show="resetPanel">找回密码</a></div>
      <p class="message" id="loginMsg"></p>
    </section>

    <section id="registerPanel" class="panel hidden">
      <h2>注册账号</h2>
      <div class="grid two">
        <input name="name" placeholder="姓名">
        <input name="email" placeholder="邮箱">
        <input name="phone" placeholder="手机号码">
        <input name="province" placeholder="省份">
        <input name="city" placeholder="城市">
        <input name="organization" placeholder="单位名称，要求一字不差">
        <input name="department" placeholder="科室">
        <input name="password" type="password" placeholder="密码">
      </div>
      <button id="registerBtn">提交注册</button>
      <div class="links"><a data-show="loginPanel">返回登录</a></div>
      <p class="message" id="registerMsg"></p>
    </section>

    <section id="resetPanel" class="panel hidden">
      <h2>找回密码</h2>
      <input id="resetPhone" placeholder="手机号码">
      <button id="smsBtn" class="secondary">获取短信验证码</button>
      <input id="resetCode" placeholder="验证码，开发环境为 123456">
      <input id="resetPassword" type="password" placeholder="新密码">
      <button id="resetBtn">重置密码</button>
      <div class="links"><a data-show="loginPanel">返回登录</a></div>
      <p class="message" id="resetMsg"></p>
    </section>

    <section id="diseasePanel" class="panel hidden">
      <h2>选择疾病 <span id="diseaseTotalCount" class="disease-total">总共录入0人</span></h2>
      <div id="diseaseList" class="disease-list"></div>
      <p class="hint">选择后会立即打开拍照/图片上传。</p>
    </section>

    <section id="caseListPanel" class="panel hidden">
      <div class="case-title-row">
        <h2>病例列表</h2>
        <div class="case-actions">
          <button id="showNewCaseBtn" class="btn-sm">新增病例</button>
          <button id="exportCasesBtn" class="btn-sm secondary">导出数据</button>
        </div>
      </div>
      <div id="newCasePanel" class="panel hidden compact-form">
        <h3>新增病例</h3>
        <div class="grid two">
          <input id="newCaseName" placeholder="姓名 *" required>
          <input id="newCaseGender" placeholder="性别 *" required>
          <input id="newCaseAge" type="number" placeholder="年龄 *" required>
          <input id="newCasePhone" placeholder="联系电话">
          <input id="newCaseIdNumber" placeholder="病历号 *" required>
        </div>
        <button id="createCaseBtn">保存病例</button>
        <p class="message" id="newCaseMsg"></p>
      </div>
      <div id="caseList" class="case-list"></div>
      <p class="message" id="caseListMsg"></p>
    </section>

    <section id="photoPanel" class="panel hidden">
      <h2 id="photoPanelTitle">拍照上传</h2>
      <input type="file" id="photoInputCamera" class="sr-only-input" accept="image/*" capture="environment">
      <input type="file" id="photoInputFile" class="sr-only-input" accept="image/*">
      <div id="photoActions" class="photo-actions">
        <label id="takePhotoBtn" class="photo-btn photo-btn-label" for="photoInputCamera">拍照</label>
        <label id="uploadBtn" class="photo-btn photo-btn-label secondary" for="photoInputFile">上传图片</label>
      </div>
      <div id="recognizeProgress" class="hidden"></div>
      <div id="previewContainer" class="hidden">
        <img id="previewImage" src="" alt="预览">
      </div>
      <button id="retryBtn" class="hidden photo-btn secondary">重新识别</button>
      <p class="message" id="photoMsg"></p>
    </section>

    <section id="recordPanel" class="panel hidden">
      <h2>校对检验数据</h2>
      <div class="subhead">病患信息</div>
      <div class="grid two">
        <input name="patient_name" placeholder="病患姓名">
        <input name="patient_gender" placeholder="性别">
        <input name="patient_age" type="number" placeholder="年龄">
        <input name="patient_phone" placeholder="联系电话">
        <input name="patient_id_number" placeholder="身份证/住院号">
      </div>
      <div class="subhead">检验项目</div>
      <div id="dynamicFields" class="grid two"></div>
      <button id="saveRecordBtn">保存检验记录</button>
      <p class="message" id="recordMsg"></p>
    </section>

    <section id="patientDetailPanel" class="panel hidden">
      <h2>病人详情</h2>
      <div id="patientProfile" class="patient-profile"></div>
      <div class="detail-tabs">
        <button class="detail-tab active" data-detail-tab="base">基础信息</button>
        <button class="detail-tab" data-detail-tab="lab">检验记录</button>
        <button class="detail-tab" data-detail-tab="treat">诊疗记录</button>
        <button class="detail-tab" data-detail-tab="follow">随访记录</button>
      </div>
      <div id="detailBaseTab" class="detail-tab-page">
        <div id="baseInfoList" class="detail-list"></div>
      </div>
      <div id="detailLabTab" class="detail-tab-page hidden">
        <div id="labRecordList" class="detail-list"></div>
      </div>
      <div id="detailTreatTab" class="detail-tab-page hidden">
        <div class="detail-list-actions"><button id="showTreatFormBtn" class="btn-sm">添加诊疗记录</button></div>
        <div id="treatList" class="detail-list"></div>
        <div id="treatFormPanel" class="panel hidden">
          <h3>新增诊疗记录</h3>
          <input id="treatTime" type="datetime-local" placeholder="时间">
          <textarea id="treatMethod" placeholder="诊疗内容"></textarea>
          <button id="addTreatBtn">保存诊疗记录</button>
          <p class="message" id="treatMsg"></p>
        </div>
      </div>
      <div id="detailFollowTab" class="detail-tab-page hidden">
        <div class="detail-list-actions"><button id="showFollowFormBtn" class="btn-sm">添加随访记录</button></div>
        <div id="followList" class="detail-list"></div>
        <div id="followFormPanel" class="panel hidden">
          <h3>新增随访记录</h3>
          <input id="followTime" type="datetime-local" placeholder="时间">
          <textarea id="followResult" placeholder="随访结果"></textarea>
          <button id="addFollowBtn">保存随访记录</button>
          <p class="message" id="followMsg"></p>
        </div>
      </div>
    </section>

    <section id="labReportPanel" class="panel hidden lab-report-panel">
      <div class="report-topbar">
        <button id="backToLabListBtn" class="btn-sm secondary">返回</button>
        <h2>检验单详情</h2>
      </div>
      <div id="labReportMeta" class="patient-profile"></div>
      <div id="labReportItems" class="report-list"></div>
      <p class="message" id="labReportMsg"></p>
    </section>

    <section id="memberReviewPanel" class="panel hidden">
      <h2>会员审核</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名字</th>
              <th>电话</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="memberReviewBody">
            <tr><td colspan="4">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <p class="message" id="memberReviewMsg"></p>
    </section>
  </main>

  <nav id="bottomNav" class="bottom-nav hidden">
    <a class="nav-item active" data-nav="diseasePanel">
      <span class="nav-icon">&#9776;</span>
      <span>上传检验</span>
    </a>
    <a class="nav-item" data-nav="caseListPanel">
      <span class="nav-icon">&#128196;</span>
      <span>病例列表</span>
    </a>
    <a class="nav-item hidden" id="memberReviewNav" data-nav="memberReviewPanel">
      <span class="nav-icon">&#10003;</span>
      <span>会员审核</span>
    </a>
    <a class="nav-item" data-nav="logout">
      <span class="nav-icon">&#10140;</span>
      <span>退出登录</span>
    </a>
  </nav>

  <script src="/static/js/jquery.min.js"></script>
  <script src="/static/js/client.js"></script>
</body>
</html>
